name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    name: Android Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thực hiện cài đặt, vá lỗi đồ họa và biên dịch tổng lực
        run: |
          # 1. Tải và cài đặt Geode CLI
          curl -sSL https://githubusercontent.com | sh
          
          # 2. Khai báo và ép giữ đường dẫn chạy lệnh cho toàn bộ khối này
          export PATH="$HOME/.geode/bin:$PATH"
          
          # 3. Khởi tạo và chọn Profile đồ họa Android
          geode profile add --name android --target android
          geode profile select android
          
          # 4. Sửa tận gốc file cấu hình để khóa chết lỗi PCH và lỗi FMT
          sed -i '1s/^/set(CMAKE_DISABLE_PRECOMPILED_HEADERS ON CACHE BOOL "" FORCE)\nset(DISABLE_PCH ON CACHE BOOL "" FORCE)\nset(GLSLANG_ENABLE_PCH OFF CACHE BOOL "" FORCE)\nset(FMT_USE_CONSTEXPR OFF CACHE BOOL "" FORCE)\nset(FMT_COMPILE_TIME_CHECKS OFF CACHE BOOL "" FORCE)\n/' CMakeLists.txt
          
          # 5. Xóa bỏ các file phân tích hiệu năng của PC gây treo máy chủ
          rm -f CodegenData.json codegenProfilerHooks.js src/profilerHooks.cpp
          
          # 6. Kích hoạt biên dịch xuất file ngay lập tức
          geode mod build --release

      - name: Đóng gói và Tải file .geode về máy
        uses: actions/upload-artifact@v4
        with:
          name: bismuth-android
          path: build/*.geode

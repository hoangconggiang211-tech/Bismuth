name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Android
            os: ubuntu-latest
            target: Android

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt và Thiết lập Geode CLI
        run: |
          curl -sSL https://githubusercontent.com | sh
          echo "$HOME/.geode/bin" >> $GITHUB_PATH

      - name: Khởi tạo Geode Profile cho Android
        run: |
          geode profile add --name android --target android
          geode profile select android

      - name: Biên dịch Mod (Build)
        run: |
          geode mod build --release

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - name: Tải file .geode về máy
        uses: actions/upload-artifact@v4
        with:
          name: bismuth-android
          path: build/*.geode

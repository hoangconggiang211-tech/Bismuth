name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Android
            os: ubuntu-latest
            target: Android

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt, Cấu hình Geode và Dọn dẹp Rác
        run: |
          # 1. Tải và cài đặt Geode CLI độc lập
          curl -sSL https://githubusercontent.com | sh
          
          # 2. Định nghĩa đường dẫn chạy lệnh trực tiếp cho phiên làm việc này
          export PATH="$HOME/.geode/bin:$PATH"
          echo "$HOME/.geode/bin" >> $GITHUB_PATH
          
          # 3. Khởi tạo Profile đồ họa mục tiêu Android
          $HOME/.geode/bin/geode profile add --name android --target android
          $HOME/.geode/bin/geode profile select android
          
          # 4. Xóa các file phân tích hiệu năng độc quyền PC để chống treo
          rm -f CodegenData.json codegenProfilerHooks.js src/profilerHooks.cpp

      - name: Biên dịch Mod (Build)
        run: |
          export PATH="$HOME/.geode/bin:$PATH"
          geode mod build --release

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - name: Tải file .geode về máy
        uses: actions/upload-artifact@v4
        with:
          name: bismuth-android
          path: build/*.geode

name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Android
            os: ubuntu-latest
            target: Android

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Bộ cài đặt Geode SDK
        uses: geode-sdk/build-config@v3
        with:
          target: ${{ matrix.config.target }}

      - name: Xóa các file phân tích hiệu năng độc quyền PC
        run: |
          rm -f CodegenData.json codegenProfilerHooks.js src/profilerHooks.cpp

      - name: Biên dịch Mod (Build)
        run: |
          cli mod build --release

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - name: Tải file .geode về máy
        uses: actions/upload-artifact@v4
        with:
          name: bismuth-android
          path: build/*.geode

name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    name: Android Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Vá tận gốc cấu hình CMake chống lỗi PCH và lỗi FMT
        run: |
          # Tạo file cấu hình tạm thời chứa các lệnh ép khóa chết lỗi PCH và lỗi FMT
          echo -e "set(CMAKE_DISABLE_PRECOMPILED_HEADERS ON CACHE BOOL \"\" FORCE)\nset(DISABLE_PCH ON CACHE BOOL \"\" FORCE)\nset(GLSLANG_ENABLE_PCH OFF CACHE BOOL \"\" FORCE)\nset(FMT_USE_CONSTEXPR OFF CACHE BOOL \"\" FORCE)\nset(FMT_COMPILE_TIME_CHECKS OFF CACHE BOOL \"\" FORCE)" > temp_config.txt
          
          # Chèn các lệnh ép khóa này lên dòng đầu tiên của file CMakeLists.txt gốc
          cat temp_config.txt CMakeLists.txt > CMakeLists.new && mv CMakeLists.new CMakeLists.txt
          
          # Xóa bỏ hoàn toàn các file phân tích hiệu năng độc quyền PC gây treo máy chủ
          rm -f CodegenData.json codegenProfilerHooks.js src/profilerHooks.cpp

      - name: Khởi tạo môi trường và Biên dịch tổng lực cho Android
        uses: geode-sdk/build-geode-mod@main
        # Ép biến môi trường hệ thống CMake chấp nhận chính sách phiên bản cũ cho mọi gói tải về
        env:
          CMAKE_ARGS: "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
        with:
          target: Android64

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - name: Gom cụm tệp tin .geode
        uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - name: Tải file .geode về máy
        uses: actions/upload-artifact@v4
        with:
          name: bismuth-android
          path: ${{ steps.build.outputs.build-output }}

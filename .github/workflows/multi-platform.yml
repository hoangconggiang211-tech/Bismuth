name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Android
            os: ubuntu-latest
            target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Khởi tạo môi trường Geode Android và Vá lỗi Đồ họa Tổng lực
        uses: geode-sdk/build-geode-mod@main
        with:
          target: ${{ matrix.config.target }}
          # Bộ tham số sửa lỗi: Tắt file PCH lỗi đồ họa, tắt hằng số ép chuỗi fmt, tắt cảnh báo nghiêm ngặt
          configure-args: |
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
            -DFMT_USE_CONSTEXPR=0
            -DFMT_COMPILE_TIME_CHECKS=0
            -DDISABLE_PCH=ON
            -DCMAKE_DISABLE_PRECOMPILED_HEADERS=ON
            -DGLSLANG_ENABLE_PCH=OFF

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - name: Gom cụm tệp tin .geode
        uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - name: Tải file .geode về máy
        uses: actions/upload-artifact@v4
        with:
          name: bismuth-android
          path: ${{ steps.build.outputs.build-output }}
